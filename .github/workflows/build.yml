name: Build installers

# Windows and Linux installers cannot be built reliably from a Mac, so each OS
# builds on its own runner. Run it by hand from the Actions tab, or push a tag
# like v1.0.0 to also publish a draft GitHub release with all installers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            dashboard/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm test

      # `dist` never publishes; the release job below does that.
      - run: pnpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
